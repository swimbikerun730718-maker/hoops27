<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#07090f">
<title>HOOPS 27 · 街頭鬥牛</title>
<meta name="description" content="網頁版 1v1 街頭籃球：投籃時機條、晃倒、灌籃、火鍋、抄截。電腦與手機都能玩。">
<meta property="og:title" content="HOOPS 27 · 街頭鬥牛">
<meta property="og:description" content="網頁版 1v1 街頭籃球，打開就能玩。">
<style>
:root{--bg:#07090f;--accent:#ff7a1a;--txt:#f3f5fa;--mut:#9aa3b5;--card:#131927;--line:#22293a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:"PingFang TC","Microsoft JhengHei","Noto Sans CJK TC","Noto Sans TC",system-ui,sans-serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
canvas{display:block;width:min(100vw,calc(100vh*16/9));aspect-ratio:16/9;background:#000}
.overlay{position:fixed;inset:0;display:flex;align-items:safe center;justify-content:center;background:radial-gradient(ellipse at center,rgba(20,26,44,.88),rgba(4,6,10,.97));z-index:10;overflow:auto;padding:16px}
.hidden{display:none!important}
.panel{max-width:940px;width:100%;text-align:center;margin:auto}
h1{font-size:clamp(40px,8vw,84px);font-weight:900;letter-spacing:2px;font-style:italic;background:linear-gradient(90deg,#ffb347,#ff5e3a 50%,#ff2d75);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.05}
h2{font-size:clamp(28px,5vw,48px);font-weight:900;font-style:italic}
.sub{color:var(--mut);margin:6px 0 10px;font-size:15px}
.label{font-size:12px;color:var(--mut);margin:16px 0 8px;letter-spacing:3px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:760px){.cards{grid-template-columns:repeat(2,1fr)}}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 10px;cursor:pointer;transition:border-color .15s,box-shadow .15s;text-align:left;color:var(--txt);font:inherit}
.card:hover{border-color:#3a4560}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,122,26,.22)}
.card .nm{font-weight:800;font-size:16px}
.card .ds{font-size:12px;color:var(--mut);margin:2px 0 8px;min-height:32px;line-height:1.35}
.stat{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mut);margin:3px 0}
.stat b{width:30px;font-weight:600}
.bar{flex:1;height:5px;background:#252c3d;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ff9a3c,#ff4d6d)}
.seg{display:inline-flex;background:var(--card);border-radius:12px;padding:4px;gap:4px;border:1px solid var(--line)}
.seg button{border:0;background:transparent;color:var(--mut);padding:8px 16px;border-radius:9px;font:inherit;font-weight:700;cursor:pointer}
.seg button.sel{background:var(--accent);color:#1a0d00}
.row{display:flex;gap:22px;justify-content:center;flex-wrap:wrap}
.go{margin-top:22px;border:0;background:linear-gradient(90deg,#ff9a3c,#ff4d6d);color:#fff;font:inherit;font-weight:900;font-size:20px;padding:14px 48px;border-radius:999px;cursor:pointer;letter-spacing:3px;box-shadow:0 8px 30px rgba(255,77,109,.35)}
.go.ghost{background:transparent;border:2px solid #3a4560;box-shadow:none;font-size:16px;padding:11px 32px;margin-left:8px}
.help{margin-top:18px;font-size:12.5px;color:var(--mut);line-height:1.9}
kbd{background:#1c2334;border:1px solid #2e3850;border-bottom-width:2px;border-radius:5px;padding:1px 6px;font-family:inherit;font-size:12px;color:#dfe5f2}
table.st{margin:16px auto;border-collapse:collapse;font-size:15px}
table.st td,table.st th{padding:7px 18px;border-bottom:1px solid var(--line)}
table.st th{color:var(--mut);font-weight:600}
table.st td:first-child{color:var(--mut);text-align:left}
#touch{position:fixed;inset:0;pointer-events:none;z-index:5}
#stick{position:absolute;left:3vw;bottom:5vh;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.16);pointer-events:auto;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;background:rgba(255,255,255,.28)}
.tbtn{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:900;color:#fff;pointer-events:auto;border:2px solid rgba(255,255,255,.28);font-size:14px;line-height:1.15;text-shadow:0 1px 3px #000;touch-action:none}
.tbtn.on{filter:brightness(1.5)}
#bShoot{right:3vw;bottom:7vh;width:108px;height:108px;background:rgba(255,106,40,.5);font-size:17px}
#bMove{right:calc(3vw + 120px);bottom:4vh;width:80px;height:80px;background:rgba(47,125,255,.5)}
#bSprint{right:calc(3vw + 22px);bottom:calc(7vh + 120px);width:72px;height:72px;background:rgba(60,190,110,.45)}
.topbtns{position:fixed;top:8px;right:8px;z-index:6;display:flex;gap:6px}
.topbtns button{background:rgba(20,26,40,.75);border:1px solid #2e3850;color:#dfe5f2;border-radius:10px;padding:6px 10px;font:inherit;font-size:14px;cursor:pointer}
#rotate{position:fixed;inset:0;z-index:50;background:#07090f;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;font-size:18px;color:var(--mut);text-align:center;padding:24px}
#rotate .ic{font-size:54px;animation:rot 1.8s ease-in-out infinite}
@keyframes rot{0%,20%{transform:rotate(0)}50%,70%{transform:rotate(-90deg)}100%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (pointer:coarse){#rotate{display:flex}}
@media (max-height:430px){#stick{width:124px;height:124px}#bShoot{width:88px;height:88px}#bMove{width:66px;height:66px;right:calc(3vw + 98px)}#bSprint{width:58px;height:58px;bottom:calc(7vh + 98px)}}
</style>

<body>
<div id="wrap"><canvas id="c"></canvas></div>

<div id="touch" class="hidden">
  <div id="stick"><div id="knob"></div></div>
  <div class="tbtn" id="bSprint"><div>衝刺</div></div>
  <div class="tbtn" id="bMove"><div>花式<br>抄截</div></div>
  <div class="tbtn" id="bShoot"><div>投籃<br><span style="font-size:11px;font-weight:600">防守=跳</span></div></div>
</div>
<div class="topbtns hidden" id="topbtns"><button id="btnMute">🔊</button><button id="btnPause">⏸</button></div>

<div class="overlay" id="menu">
  <div class="panel">
    <h1>HOOPS 27</h1>
    <div class="sub">街頭 1v1 鬥牛 · 抓準時機出手、晃倒對手、隔扣封阻</div>
    <div class="label">選擇你的球員</div>
    <div class="cards" id="cards"></div>
    <div class="row">
      <div><div class="label">難度</div><div class="seg" id="segDiff"></div></div>
      <div><div class="label">目標分數</div><div class="seg" id="segTarget"></div></div>
    </div>
    <button class="go" id="btnStart">開始比賽</button>
    <div class="help" id="helpKeys">
      <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / 方向鍵 移動　<kbd>Shift</kbd> 衝刺<br>
      <kbd>空白鍵</kbd> 按住起跳、<b>在最高點放開</b>出手(時機條綠區=完美)· 禁區衝刺按下=灌籃<br>
      <kbd>E</kbd> 進攻：花式運球(可能晃倒對手)· 防守：抄截　防守時 <kbd>空白鍵</kbd> 跳起封阻<br>
      進球後交換球權；搶到防守籃板或抄截要先把球<b>帶出三分線</b>(清球)才能出手 · 進攻時間 14 秒
    </div>
  </div>
</div>

<div class="overlay hidden" id="pauseMenu">
  <div class="panel">
    <h2>暫停</h2>
    <button class="go" id="btnResume">繼續</button><button class="go ghost" id="btnQuit">回主選單</button>
  </div>
</div>

<div class="overlay hidden" id="over">
  <div class="panel">
    <h2 id="overTitle"></h2>
    <div class="sub" id="overScore"></div>
    <table class="st" id="overStats"></table>
    <button class="go" id="btnAgain">再來一場</button><button class="go ghost" id="btnMenu">回主選單</button>
  </div>
</div>

<div id="rotate"><div class="ic">📱</div>請將手機橫放來玩</div>

<script>
'use strict';
// ================= 基本設定 =================
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 1280, H = 720; cv.width = W; cv.height = H;
const FONT = '"PingFang TC","Microsoft JhengHei","Noto Sans CJK TC","Noto Sans TC",sans-serif';
const HOOP = { x: 0, y: 5.25, z: 10 };           // 單位：英尺；y=0 為底線，y=47 為中線
const CAM = { y: 95, h: 38, f: 1250, hor: -229 };
const SHOT_CLOCK = 14;
const IS_TOUCH = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

function P(x, y, z = 0) { const d = CAM.y - y, s = CAM.f / d; return { x: W / 2 + x * s, y: CAM.hor + (CAM.h - z) * s, s }; }
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = (a, b) => a + Math.random() * (b - a);
const hyp = Math.hypot;
const pick = a => a[Math.floor(Math.random() * a.length)];
function gauss() { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
const dHoop = o => hyp(o.x - HOOP.x, o.y - HOOP.y);
const beyondArc = (x, y) => y < 14.2 ? Math.abs(x) >= 22 : hyp(x, y - HOOP.y) >= 23.75;

const ARCHS = [
  { id: 'shooter', nm: '神射手', ds: '三分雨、出手穩，切入普通', r: { spd: .88, three: .93, mid: .86, inside: .62, dunk: .35, handle: .78, def: .6, stl: .62, blk: .38 } },
  { id: 'slasher', nm: '灌籃怪物', ds: '爆發力強、禁區霸主、封阻高手', r: { spd: .95, three: .46, mid: .64, inside: .9, dunk: .97, handle: .62, def: .76, stl: .55, blk: .9 } },
  { id: 'handler', nm: '控球魔術師', ds: '運球晃人、抄截、速度最快', r: { spd: 1, three: .77, mid: .8, inside: .76, dunk: .58, handle: .97, def: .7, stl: .9, blk: .4 } },
  { id: 'allround', nm: '全能前鋒', ds: '沒有明顯弱點的六邊形戰士', r: { spd: .92, three: .78, mid: .8, inside: .8, dunk: .8, handle: .78, def: .8, stl: .72, blk: .72 } },
];
const STAT_LABELS = [['three', '三分'], ['mid', '中距'], ['inside', '禁區'], ['dunk', '灌籃'], ['handle', '運球'], ['def', '防守']];
const DIFFS = {
  rookie: { nm: '新秀', ai: .82, react: .34, sd: .13, green: .075, spd: .9, stl: .25 },
  pro: { nm: '職業', ai: .95, react: .22, sd: .085, green: .05, spd: .97, stl: .45 },
  hof: { nm: '名人堂', ai: 1.05, react: .13, sd: .05, green: .035, spd: 1.02, stl: .7 },
};
const SPOTS = {
  shooter: [[-22, 3], [22, 3], [-16, 22], [16, 22], [0, 27], [-9, 25], [9, 25]],
  slasher: [[-10, 14], [10, 14], [0, 17], [-6, 9], [6, 9], [0, 26]],
  handler: [[0, 28], [-12, 24], [12, 24], [-6, 16], [6, 16]],
  allround: [[-14, 18], [14, 18], [0, 24], [-20, 8], [20, 8], [0, 15]],
};
const COLS = [
  { jer: '#1f6fff', shorts: '#1848b0', trim: '#ffd23f', skin: '#c98d5d', hair: '#1b1b1b', shoe: '#f4f4f4', num: '#fff' },
  { jer: '#e8334a', shorts: '#a81d35', trim: '#ffffff', skin: '#7a4b30', hair: '#0e0e0e', shoe: '#161616', num: '#fff' },
];

// ================= 音效(WebAudio 合成) =================
let AC = null, muted = false, NB = null;
function au() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function env(g, t0, a, d, v) { g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(v, t0 + a); g.gain.exponentialRampToValueAtTime(0.0001, t0 + a + d); }
function tone(f, d, type, v, f2) {
  const a = au(); if (!a || muted) return;
  const o = a.createOscillator(), g = a.createGain(), t = a.currentTime;
  o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  env(g, t, .005, d, v); o.connect(g).connect(a.destination); o.start(t); o.stop(t + d + .05);
}
function noise(d, v, freq, q, type, att = .01) {
  const a = au(); if (!a || muted) return;
  if (!NB) { NB = a.createBuffer(1, a.sampleRate * 2, a.sampleRate); const ch = NB.getChannelData(0); for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1; }
  const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain(), t = a.currentTime;
  s.buffer = NB; f.type = type; f.frequency.value = freq; f.Q.value = q; env(g, t, att, d, v);
  s.connect(f).connect(g).connect(a.destination); s.start(t); s.stop(t + att + d + .05);
}
const sfx = {
  bounce: (v = 1) => tone(125, .09, 'sine', .3 * v, 55),
  swish: () => noise(.3, .25, 5200, .7, 'highpass', .02),
  clank: (v = 1) => { tone(540, .35, 'triangle', .13 * v, 500); tone(1230, .25, 'sine', .06 * v); },
  cheer: () => { noise(1.9, .17, 1100, .4, 'bandpass', .25); G.crowd = 2; },
  whistle: () => { tone(2900, .28, 'sine', .07); tone(3080, .28, 'sine', .05); },
  buzzer: () => tone(160, .8, 'sawtooth', .1),
  block: () => tone(90, .22, 'square', .13, 50),
  swipe: () => noise(.12, .12, 2500, 1, 'bandpass', .01),
};

// ================= 遊戲狀態 =================
const G = {
  state: 'menu', players: [], score: [0, 0], target: 21, diffKey: 'pro', diff: DIFFS.pro, archIdx: 0,
  offense: 0, shotClock: SHOT_CLOCK, needsClear: [false, false], checkT: 0, deadT: 0, pendingCheck: 0,
  msgs: [], net: 0, rimShake: 0, crowd: 0, board: 0, t: 0,
};
const ball = { state: 'held', owner: null, x: 0, y: 30, z: 3, vx: 0, vy: 0, vz: 0, f: null, lastTouch: 0, ph: 0, prevS: 1 };
const user = () => G.players[0], cpu = () => G.players[1], other = p => G.players[1 - p.team];

function mkPlayer(team, arch, isAI) {
  const r = { ...arch.r };
  if (isAI) for (const k in r) r[k] = Math.min(.99, r[k] * G.diff.ai);
  return {
    team, arch, isAI, r, col: COLS[team], num: team === 0 ? 7 : 11,
    x: 0, y: 30, z: 0, vx: 0, vy: 0, vz: 0, stam: 100, sprint: false,
    stun: 0, reach: 0, dashT: 0, dashDx: 0, dashDy: 0, dashCd: 0, stealCd: 0, lastDash: 1,
    shot: null, dunkHang: 0, anim: 0, side: 1, pop: null, meter: null,
    ai: { decT: 0, mode: 'spot', tx: 0, ty: 26, contestT: -1, stealT: rnd(1, 2), releaseAt: .9, jumpCd: 0 },
    aiIn: { mx: 0, my: 0, spr: false },
    st: { pts: 0, fga: 0, fgm: 0, tpa: 0, tpm: 0, dnk: 0, grn: 0, stl: 0, blk: 0, ank: 0 },
  };
}

function msg(text, color = '#fff', big = false, dur = 1.5) {
  G.msgs.push({ text, color, big, t: 0, dur });
  if (G.msgs.length > 3) G.msgs.shift();
}
function pop(p, text, color) { p.pop = { text, color, t: 0 }; }

// ================= 動作 =================
function jump(p) {
  if (p.z > .01 || p.shot || p.stun > 0 || p.dunkHang > 0) return;
  p.vz = 12.5 + 2.5 * p.r.blk;
}

function startShot(p) {
  if (p.shot || p.z > .01 || p.stun > 0 || ball.owner !== p) return;
  if (G.needsClear[p.team]) { if (!p.isAI) pop(p, '先清球！帶出三分線', '#ffd23f'); return; }
  const d = dHoop(p);
  let type = 'jumper';
  if (d < 8.5) type = (p.r.dunk >= .55 && d < 7.5 && (p.sprint || p.r.dunk > .8 || d < 4)) ? 'dunk' : 'layup';
  p.shot = { type, t: 0, meter: 0, rel: false, d, three: beyondArc(p.x, p.y) };
  if (type === 'jumper') { p.vz = 12; p.vx *= .2; p.vy *= .2; }
  else {
    const k = 1.3 / Math.max(d, .1);
    const tx = HOOP.x + (p.x - HOOP.x) * k, ty = Math.max(HOOP.y + .7, HOOP.y + (p.y - HOOP.y) * k);
    p.vx = (tx - p.x) / .42; p.vy = (ty - p.y) / .42; p.vz = type === 'dunk' ? 17 : 13;
  }
  if (p.isAI) p.ai.releaseAt = clamp(.9 + gauss() * G.diff.sd, .55, 1.2);
  const o = other(p);
  if (o.isAI) o.ai.contestT = G.diff.react * rnd(.8, 1.25);
}

function release(p) {
  const s = p.shot; if (!s || s.rel) return;
  s.rel = true;
  if (ball.owner !== p) return;
  const o = other(p), dd = hyp(o.x - p.x, o.y - p.y);
  let tq = 'auto', timing = 1;
  if (s.type === 'jumper') {
    const e = s.meter - .9, gw = p.isAI ? .04 : G.diff.green, ae = Math.abs(e);
    if (ae <= gw) tq = 'green';
    else if (ae <= .12) tq = 'good';
    else if (ae <= .2) { tq = e < 0 ? 'early' : 'late'; timing = .62; }
    else { tq = e < 0 ? 'vearly' : 'vlate'; timing = .3; }
    if (!p.isAI) {
      const T = { green: ['完美！', '#3dff8a'], good: ['不錯', '#c8ff6a'], early: ['稍早', '#ffd23f'], late: ['稍晚', '#ffd23f'], vearly: ['太早', '#ff6b6b'], vlate: ['太晚', '#ff6b6b'] }[tq];
      pop(p, T[0], T[1]); p.meter = { v: s.meter, tq, t: 0 };
    }
  }
  // 封阻判定
  const oAir = o.z > .7;
  const front = ((HOOP.x - p.x) * (o.x - p.x) + (HOOP.y - p.y) * (o.y - p.y)) > -1;
  if (oAir && front && o.stun <= 0 && dd < (s.type === 'jumper' ? 4 : 4.8)) {
    let bc = o.r.blk * .62 * (1 - dd / 5.5) + .08;
    if (tq === 'green') bc *= .4;
    if (s.type === 'dunk') bc *= .7;
    if (Math.random() < bc) { blockShot(p, o); return; }
  }
  const pm = makeProb(p, s, tq, timing, dd, oAir && dd < 4.5);
  p.st.fga++; if (s.three) p.st.tpa++;
  launch(p, s, Math.random() < pm, s.three ? 3 : 2, tq);
}

function makeProb(p, s, tq, timing, dd, oAirClose) {
  let pr;
  if (s.type === 'dunk') pr = .72 + .26 * p.r.dunk;
  else if (s.type === 'layup') pr = .5 + .38 * p.r.inside;
  else {
    const rt = s.three ? p.r.three : (s.d < 14 ? (p.r.mid + p.r.inside) / 2 : p.r.mid);
    pr = .2 + .5 * rt;
    if (s.d > 26) pr -= (s.d - 26) * .05;
    pr = tq === 'green' ? .97 : pr * timing;
  }
  let cf = 1;
  if (dd < 6) { cf = .35 + .65 * clamp((dd - 1.5) / 4.5, 0, 1); if (oAirClose) cf *= .8; }
  if (tq === 'green') cf = Math.sqrt(cf);
  if (s.type === 'dunk') cf = .55 + .45 * cf;
  pr *= cf * (.82 + .18 * p.stam / 100);
  return clamp(pr, .02, .98);
}

function launch(p, s, make, pts, tq) {
  const sx = p.x + p.side * .3, sy = p.y, sz = p.z + (s.type === 'jumper' ? 8.6 : 8.3);
  let ex = HOOP.x, ey = HOOP.y, ez = HOOP.z + .3;
  if (!make) { const a = rnd(0, Math.PI * 2); ex += Math.cos(a) * .85; ey += Math.sin(a) * .85; ez = HOOP.z + .2; }
  let T, Hh;
  if (s.type === 'dunk') { T = .14; Hh = 0; }
  else if (s.type === 'layup') { T = .5; Hh = 2; }

}

function blockShot(p, o) {

  ball.state = 'loose'; ball.owner = null; ball.lastTouch = o.team; G.offense = p.team;
  ball.x = p.x; ball.y = p.y; ball.z = p.z + 8.5;
  const a = Math.atan2(p.y - HOOP.y, p.x - HOOP.x) + rnd(-.7, .7), sp = rnd(10, 16);

}

function dribbleMove(p) {
  if (p.dashCd > 0 || p.shot || p.z > .01 || p.stun > 0) return;
  const hx = HOOP.x - p.x, hy = HOOP.y - p.y, hl = hyp(hx, hy) || 1;
  const px = -hy / hl, py = hx / hl;
  let dir = -p.lastDash;
  if (!p.isAI && inp.mx) dir = Math.sign(inp.mx * px) || dir;
  p.lastDash = dir;

  const o = other(p), d = hyp(o.x - p.x, o.y - p.y);

    const ch = ahead ? p.r.handle * .33 - o.r.def * .28 + p.stam / 1000 + (o.reach > 0 ? .25 : 0) : 0;

}

function trySteal(p) {
  if (p.stealCd > 0 || p.stun > 0) return;
  const h = ball.owner;
  if (ball.state !== 'held' || !h || h.team === p.team) return;
  p.stealCd = .8; p.reach = .5; sfx.swipe();
  if (hyp(h.x - p.x, h.y - p.y) > 4.2) return;
  let ch = p.r.stl * .4 - h.r.handle * .18 + .05;

function giveBall(p, kind) {

  if (p.team !== G.offense) {
    G.offense = p.team;
    G.needsClear = [false, false];

  } else if (kind === 'rebound') msg(p.isAI ? 'CPU 進攻籃板' : '進攻籃板！', '#cfd6e6');

}

function checkBall(team) {
  G.state = 'check'; G.checkT = 1.3; G.offense = team; G.needsClear = [false, false]; G.shotClock = SHOT_CLOCK;
  const o = G.players[team], d = G.players[1 - team];

const keys = {}, inp = { mx: 0, my: 0, sprint: false }, touch = { active: false, x: 0, y: 0, sprint: false };

// 觸控
(function setupTouch() {
  const stick = document.getElementById('stick'), knob = document.getElementById('knob');
  let sid = null;
  const setKnob = (x, y) => { knob.style.transform = `translate(${x}px,${y}px)`; };
  const move = e => {
    const r = stick.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    let dx = e.clientX - cx, dy = e.clientY - cy; const m = hyp(dx, dy), R = r.width * .38;
    if (m > R) { dx *= R / m; dy *= R / m; }
    setKnob(dx, dy); touch.x = dx / R; touch.y = dy / R;

  };
  stick.addEventListener('pointerdown', e => { au(); sid = e.pointerId; stick.setPointerCapture(sid); touch.active = true; move(e); });
  stick.addEventListener('pointermove', e => { if (e.pointerId === sid) move(e); });
  const end = e => { if (e.pointerId !== sid) return; sid = null; touch.active = false; touch.x = touch.y = 0; setKnob(0, 0); };
  stick.addEventListener('pointerup', end); stick.addEventListener('pointercancel', end);

    const u = e => { el.classList.remove('on'); up && up(); };
    el.addEventListener('pointerup', u); el.addEventListener('pointercancel', u);

  btn('bShoot', () => actPrimary(true), () => actPrimary(false));
  btn('bMove', () => actSecondary());

// ================= AI =================
function aiUpdate(p, dt) {
  const o = other(p), a = p.ai;
  let mx = 0, my = 0, spr = false;
  const goTo = (tx, ty, stop = .8) => {
    const dx = tx - p.x, dy = ty - p.y, d = hyp(dx, dy);
    if (d > stop) { mx = dx / d; my = dy / d; } else if (d > .15) { mx = dx / stop; my = dy / stop; }
  };
  a.jumpCd = Math.max(0, a.jumpCd - dt);
  if (ball.state === 'held' && ball.owner === p) {
    a.decT -= dt;
    const dh = dHoop(p);
    if (!p.shot && a.decT <= 0) {
      a.decT = rnd(.22, .5);
      const open = hyp(o.x - p.x, o.y - p.y);
      const tx = (HOOP.x - p.x) / dh, ty = (HOOP.y - p.y) / dh, ox = o.x - p.x, oy = o.y - p.y;
      const along = ox * tx + oy * ty, lat = Math.abs(ox * ty - oy * tx);
      const laneBlocked = along > 0 && along < dh && lat < 3.2 && o.stun <= 0;
      if (G.needsClear[p.team]) a.mode = 'clear';
      else if (dh < 7.5 && (!laneBlocked || Math.random() < .5)) startShot(p);
      else if (G.shotClock < 2.2) startShot(p);
      else {
        const range = p.r.three > .7 ? 26 : (p.r.mid > .75 ? 21 : 15);
        if ((open > (dh > 22 ? 3.8 : 5.5) || o.stun > 0) && dh < range && Math.random() < .75) startShot(p);
        else if (!laneBlocked && Math.random() < .25 + p.r.inside * .35) a.mode = 'drive';
        else if (open < 4.5 && p.dashCd <= 0 && Math.random() < .45) { dribbleMove(p); a.mode = 'drive'; }
        else if (a.mode !== 'spot' || hyp(a.tx - p.x, a.ty - p.y) < 1.5) { const s = pick(SPOTS[p.arch.id]); a.tx = s[0]; a.ty = s[1]; a.mode = 'spot'; }
      }
    }
    if (!p.shot) {
      if (a.mode === 'clear') {
        const ux = (p.x - HOOP.x) / (dh || 1), uy = Math.max(.35, (p.y - HOOP.y) / (dh || 1)), ul = hyp(ux, uy);
        goTo(clamp(HOOP.x + ux / ul * 26.5, -23.5, 23.5), clamp(HOOP.y + uy / ul * 26.5, 1, 44), .3);
      } else if (a.mode === 'drive') { goTo(HOOP.x, HOOP.y + 2, .1); spr = p.stam > 20; }
      else goTo(a.tx, a.ty);
    }
  } else if (ball.state === 'held' && ball.owner === o) {
    const dh = dHoop(o) || 1, gd = dh > 28 ? 6 : dh > 24 ? 4.2 : 3.2;
    const tx = o.x + (HOOP.x - o.x) / dh * gd, ty = o.y + (HOOP.y - o.y) / dh * gd;
    goTo(tx, ty, .5); spr = hyp(tx - p.x, ty - p.y) > 4;
    if (o.shot && !o.shot.rel) {
      goTo(o.x, o.y, 1.6); spr = true;
      if (a.contestT >= 0) { a.contestT -= dt; if (a.contestT < 0 && hyp(o.x - p.x, o.y - p.y) < 7) jump(p); }
    }
    a.stealT -= dt;
    if (a.stealT <= 0) { a.stealT = rnd(1.2, 3); if (hyp(o.x - p.x, o.y - p.y) < 4 && Math.random() < G.diff.stl) trySteal(p); }
  } else if (ball.state === 'flight') {
    const dh = dHoop(p) || 1;
    goTo(HOOP.x + (p.x - HOOP.x) / dh * 7, HOOP.y + Math.max(2, (p.y - HOOP.y) / dh * 7), .5); spr = true;
  } else if (ball.state === 'loose') {
    goTo(ball.x + ball.vx * .25, ball.y + ball.vy * .25, .2); spr = true;
    if (ball.z > 6 && ball.z < 11 && hyp(ball.x - p.x, ball.y - p.y) < 3 && a.jumpCd <= 0) { jump(p); a.jumpCd = 1; }
  }
  p.aiIn.mx = mx; p.aiIn.my = my; p.aiIn.spr = spr;
}

// ================= 更新 =================
function updPlayer(p, dt, mx, my, sprint) {
  p.stun = Math.max(0, p.stun - dt); p.reach = Math.max(0, p.reach - dt);
  p.dashCd = Math.max(0, p.dashCd - dt); p.stealCd = Math.max(0, p.stealCd - dt);
  if (p.pop) { p.pop.t += dt; if (p.pop.t > 1.1) p.pop = null; }
  if (p.meter) { p.meter.t += dt; if (p.meter.t > .8) p.meter = null; }
  const air = p.z > .01 || p.vz > 0;
  if (p.dunkHang > 0) {
    p.dunkHang -= dt; p.vx = p.vy = p.vz = 0;
    if (p.dunkHang <= 0) p.vz = -1;
  } else if (p.shot) {
    const s = p.shot; s.t += dt;
    if (s.type === 'jumper') {
      if (!s.rel) s.meter += dt * 2.35;
      p.vx *= .85; p.vy *= .85;
      if (!s.rel && (s.meter >= 1.25 || (p.isAI && s.meter >= p.ai.releaseAt))) release(p);
    } else if (!s.rel && s.t >= .42) release(p);
  } else if (!air) {
    let spd = 15 * p.r.spd * (p.isAI ? G.diff.spd : 1);
    p.sprint = sprint && p.stam > 5 && (mx !== 0 || my !== 0);
    if (p.sprint) { spd *= 1.4; p.stam -= 22 * dt; } else p.stam = Math.min(100, p.stam + 14 * dt);
    if (p.stun > 0) spd *= .12;
    if (p.reach > 0) spd *= .45;
    if (ball.owner === p) spd *= .93;
    let tvx = mx * spd, tvy = my * spd;
    if (p.dashT > 0) { p.dashT -= dt; tvx = p.dashDx * 27; tvy = p.dashDy * 27; }
    const k = Math.min(1, dt * (p.dashT > 0 ? 30 : 11));
    p.vx += (tvx - p.vx) * k; p.vy += (tvy - p.vy) * k;
  }
  p.stam = Math.max(0, p.stam);
  p.x += p.vx * dt; p.y += p.vy * dt;
  if (p.dunkHang <= 0) { p.z += p.vz * dt; p.vz -= 34 * dt; }
  if (p.z <= 0) {
    p.z = 0;
    if (p.vz < 0) { p.vz = 0; if (p.shot) { if (!p.shot.rel) release(p); p.shot = null; } }
  }
  p.x = clamp(p.x, -24.3, 24.3); p.y = clamp(p.y, .6, 43);
  const sp = hyp(p.vx, p.vy); p.anim += sp * dt * .55;
  if (Math.abs(p.vx) > 1 && !p.shot) p.side = p.vx > 0 ? 1 : -1;
}

function separate() {
  const [a, b] = G.players;
  if (a.dunkHang > 0 || b.dunkHang > 0) return;
  const dx = b.x - a.x, dy = b.y - a.y, d = hyp(dx, dy), md = 2.1;
  if (d < md && d > .001) { const push = (md - d) / 2; a.x -= dx / d * push; a.y -= dy / d * push; b.x += dx / d * push; b.y += dy / d * push; }
}

function updBall(dt) {
  if (ball.state === 'held') {
    const p = ball.owner;
    if (p.shot && !p.shot.rel) {
      ball.x = p.x + p.side * .2; ball.y = p.y - .1;
      ball.z = p.z + (p.shot.type === 'jumper' ? 6.8 + Math.min(1, p.shot.t / .3) * 1.6 : 6 + Math.min(1, p.shot.t / .42) * 2.6);
    } else if (G.state === 'check') { ball.x = p.x + p.side * 1.1; ball.y = p.y + .3; ball.z = 3.4; }
    else {
      ball.ph += dt * (7 + hyp(p.vx, p.vy) * .35);
      const s = Math.abs(Math.sin(ball.ph));
      if (s < .15 && ball.prevS >= .15 && G.state === 'play') sfx.bounce(.3);
      ball.prevS = s;
      ball.x = p.x + p.side * 1.15; ball.y = p.y + .35; ball.z = .4 + s * 2.6 + p.z;
    }
  } else if (ball.state === 'flight') {
    const f = ball.f; f.t += dt; const u = Math.min(1, f.t / f.T);
    ball.x = f.sx + (f.ex - f.sx) * u; ball.y = f.sy + (f.ey - f.sy) * u;
    ball.z = f.sz + (f.ez - f.sz) * u + f.Hh * 4 * u * (1 - u);
    if (u >= 1) arrive(f);
  } else if (ball.state === 'loose' || ball.state === 'dead') {
    ball.vz -= 32 * dt;
    if (ball.state === 'dead' && ball.z > 8.2) { ball.x = HOOP.x; ball.y = HOOP.y; }
    else { ball.x += ball.vx * dt; ball.y += ball.vy * dt; }
    ball.z += ball.vz * dt;
    if (ball.z < .4) {
      ball.z = .4;
      if (ball.vz < -3) { ball.vz = -ball.vz * .62; sfx.bounce(.6); } else ball.vz = 0;
      const fr = Math.pow(.35, dt); ball.vx *= fr; ball.vy *= fr;
    }
    if (ball.state === 'loose') {
      if (Math.abs(ball.x) > 25.5 || ball.y > 45 || ball.y < -.5) {
        msg('出界', '#cfd6e6'); checkBall(1 - ball.lastTouch); return;
      }
      let best = null, bd = 1e9;
      for (const p of G.players) {
        if (p.stun > 0 || p.shot || p.dunkHang > 0) continue;
        const d = hyp(p.x - ball.x, p.y - ball.y);
        if (d < 2.4 && ball.z < 7.5 + p.z && d < bd) { bd = d; best = p; }

}

function arrive(f) {

  if (f.make) {
    ball.state = 'dead'; ball.x = HOOP.x; ball.y = HOOP.y; ball.z = HOOP.z - .2; ball.vx = 0; ball.vy = rnd(1, 2.5); ball.vz = -6;
    G.score[p.team] += f.pts; p.st.fgm++; p.st.pts += f.pts;
    if (f.pts === 3) p.st.tpm++;
    if (f.type === 'dunk') p.st.dnk++;
    if (f.tq === 'green') p.st.grn++;
    G.net = .6; G.board = .8; sfx.swish();
    let t = f.type === 'dunk' ? '暴力灌籃！！' : f.pts === 3 ? '三分命中！' : '進球！';
    if (f.tq === 'green') t = '完美出手 · ' + t;
    msg((p.isAI ? 'CPU ' : '') + t, p.team === 0 ? '#6fb1ff' : '#ff6b7d', true);
    if (f.type === 'dunk' || f.pts === 3 || f.tq === 'green') sfx.cheer();
    if (f.type === 'dunk') { G.rimShake = .5; sfx.clank(.5); }
    G.deadT = 1.1; G.pendingCheck = 1 - p.team;
  } else {
    sfx.clank(); G.rimShake = .25;
    const a = Math.atan2(ball.y - HOOP.y, ball.x - HOOP.x) + rnd(-.6, .6), sp = rnd(5, 12);
    ball.state = 'loose'; ball.vx = Math.cos(a) * sp; ball.vy = Math.abs(Math.sin(a)) * sp * .9 + 2; ball.vz = rnd(6, 12);
    G.shotClock = SHOT_CLOCK;
  }
}

function rules(dt) {
  if (ball.state === 'held') {
    const o = ball.owner;
    if (G.needsClear[o.team] && beyondArc(o.x, o.y)) { G.needsClear[o.team] = false; if (!o.isAI) pop(o, '清球完成', '#7dffb0'); }
    if (!(o.shot && o.shot.rel)) {
      G.shotClock -= dt;
      if (G.shotClock <= 0) { msg('進攻時間違例', '#ff6b6b', true); sfx.buzzer(); checkBall(1 - o.team); }
    }
  } else if (ball.state === 'dead') {
    G.deadT -= dt;
    if (G.deadT <= 0) {
      const w = G.score.findIndex(s => s >= G.target);
      if (w >= 0) endGame(w); else checkBall(G.pendingCheck);
    }
  }
}

function update(dt) {
  G.t += dt;
  G.msgs.forEach(m => m.t += dt); G.msgs = G.msgs.filter(m => m.t < m.dur);
  G.net = Math.max(0, G.net - dt); G.rimShake = Math.max(0, G.rimShake - dt);
  G.crowd = Math.max(0, G.crowd - dt); G.board = Math.max(0, G.board - dt);
  if (G.state === 'check') {
    G.checkT -= dt; updBall(dt);
    if (G.checkT <= 0) G.state = 'play';
    return;
  }
  if (G.state !== 'play') return;
  readMove();
  const u = user(), c = cpu();
  updPlayer(u, dt, inp.mx, inp.my, inp.sprint);
  aiUpdate(c, dt);
  updPlayer(c, dt, c.aiIn.mx, c.aiIn.my, c.aiIn.spr);
  separate();
  updBall(dt);

}

// ================= 繪圖 =================
function poly3(pts, fill, stroke, lw) {
  ctx.beginPath();
  pts.forEach((q, i) => { const s = P(q[0], q[1], q[2] || 0); i ? ctx.lineTo(s.x, s.y) : ctx.moveTo(s.x, s.y); });
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}

function drawArena() {
  ctx.drawImage(bgCanvas, 0, 0);
  // 觀眾(歡呼時會跳動)
  const bob = Math.min(1, G.crowd);
  for (const q of crowd) {
    const y = q.y - (bob ? Math.abs(Math.sin(G.t * 13 + q.ph)) * 5 * q.sc * bob : 0);
    ctx.fillStyle = q.c; rrect(q.x - 6 * q.sc, y - 4 * q.sc, 12 * q.sc, 16 * q.sc, 4 * q.sc); ctx.fill();
    ctx.fillStyle = q.sk; ctx.beginPath(); ctx.arc(q.x, y - 8 * q.sc, 4.6 * q.sc, 0, 7); ctx.fill();
  }
  const sh = ctx.createLinearGradient(0, 40, 0, WALL_Y);
  sh.addColorStop(0, 'rgba(5,7,13,.75)'); sh.addColorStop(1, 'rgba(5,7,13,.25)');
  ctx.fillStyle = sh; ctx.fillRect(0, 0, W, WALL_Y);
  // 燈光
  for (const lx of [W * .18, W * .5, W * .82]) {
    const g = ctx.createRadialGradient(lx, 0, 0, lx, 0, 260);
    g.addColorStop(0, 'rgba(255,240,210,.22)'); g.addColorStop(1, 'rgba(255,240,210,0)');
    ctx.fillStyle = g; ctx.fillRect(lx - 260, 0, 520, 260);

  ctx.fillStyle = G.board > 0 ? '#ffd23f' : '#ff7a1a';
  for (let x = -off; x < W; x += tw) ctx.fillText(txt, x, WALL_Y - 15);
  ctx.restore();
}

function drawHoopBack() {
  const shake = Math.sin(G.t * 70) * G.rimShake * .18;
  // 籃架
  const base = P(0, -5.5, 0), top = P(0, -5.5, 12.2);
  ctx.fillStyle = '#1b2233'; const bw = 2.6 * base.s; rrect(base.x - bw, base.y - 3.2 * base.s, bw * 2, 3.4 * base.s, 6); ctx.fill();
  ctx.strokeStyle = '#2a3348'; ctx.lineCap = 'round';
  ctx.lineWidth = .7 * base.s; ctx.beginPath(); ctx.moveTo(base.x, base.y - 2 * base.s); ctx.lineTo(top.x, top.y); ctx.stroke();
  const arm = P(0, 4, 11.4);
  ctx.lineWidth = .45 * arm.s; ctx.beginPath(); ctx.moveTo(top.x, top.y); ctx.lineTo(arm.x, arm.y); ctx.stroke();

  poly3([[-3, 4, 9.5], [3, 4, 9.5], [3, 4, 13], [-3, 4, 13]], 'rgba(210,230,255,.2)', G.board > 0 ? `rgba(255,${120 + 100 * (1 - G.board)},40,1)` : '#f2f5fa', G.board > 0 ? 5 : 3);
  poly3([[-1, 4, 10], [1, 4, 10], [1, 4, 11.5], [-1, 4, 11.5], [-1, 4, 10]], null, '#f2f5fa', 2.5);
  poly3([[0, 4, 10 + shake], [0, 4.5, 10 + shake]], null, '#ff5a1f', 4);
  drawRimHalf(true);
}
function rimPt(a, r, z) { return [HOOP.x + Math.cos(a) * r, HOOP.y + Math.sin(a) * r, z]; }
function drawRimHalf(back) {
  const shake = Math.sin(G.t * 70) * G.rimShake * .18, rz = HOOP.z + shake;
  const a0 = back ? Math.PI : 0, a1 = back ? Math.PI * 2 : Math.PI;
  const drop = G.net * 1.2, bz = 8.2 - drop, sway = Math.sin(G.t * 30) * G.net * .15;

  for (let i = 0; i <= 8; i++) {
    const a = a0 + (a1 - a0) * i / 8;
    poly3([rimPt(a, .75, rz), rimPt(a + .35, .6, (rz + bz) / 2), rimPt(a, .42 + sway, bz)], null, '#f4f6fa', 1.4);
    poly3([rimPt(a, .75, rz), rimPt(a - .35, .6, (rz + bz) / 2), rimPt(a, .42 + sway, bz)], null, '#f4f6fa', 1.4);

function limb(pts, w, c) {
  ctx.strokeStyle = c; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.lineJoin = 'round';

function drawShadow(x, y, z, rx) {
  const g = P(x, y, 0), k = Math.max(.35, 1 - z / 14);
  ctx.fillStyle = `rgba(0,0,0,${.35 * k})`; ctx.beginPath(); ctx.ellipse(g.x, g.y, rx * g.s * k, rx * .34 * g.s * k, 0, 0, 7); ctx.fill();

function drawPlayer(p) {
  const b = P(p.x, p.y, p.z), s = b.s, c = p.col, X = b.x, Y = b.y;
  const onGround = p.z < .02, spd = hyp(p.vx, p.vy);
  const run = onGround && spd > 1.5 ? Math.sin(p.anim) : 0, ra = onGround ? Math.min(1, spd / 12) : 0;
  const oppHas = ball.state === 'held' && ball.owner && ball.owner.team !== p.team;
  const stance = oppHas && !p.shot && onGround && G.state === 'play';
  const hip = (stance ? 2.75 : 3.1) * s, sh = hip + 2.05 * s, L = .36 * s;
  ctx.save(); ctx.translate(X, Y);

  ctx.fillStyle = c.jer; rrect(-.74 * s, -sh - .15 * s, 1.48 * s, sh - hip + .5 * s, .36 * s); ctx.fill();
  ctx.strokeStyle = c.trim; ctx.lineWidth = Math.max(1.5, .09 * s); ctx.stroke();
  ctx.fillStyle = c.num; ctx.font = `900 ${.95 * s}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(p.num, 0, -hip - 1.05 * s);

  const shY = -sh + .15 * s, shX = .64 * s;

  const up = -(sh + 1.9 * s);

  else if (p.shot && !p.shot.rel) { hl = [p.side * .05 * s - .3 * s, -(sh + 1.5 * s)]; hr = [p.side * .05 * s + .3 * s, -(sh + 1.5 * s)]; }
  else if (p.shot) { const a = [p.side * .3 * s, -(sh + 2 * s)], b2 = [-p.side * .5 * s, -(sh + .9 * s)]; if (p.side > 0) { hr = a; hl = b2; } else { hl = a; hr = b2; } }
  else if (ball.state === 'held' && ball.owner === p && G.state === 'play') {
    const bp = P(ball.x, ball.y, ball.z + .4), hand = [bp.x - X, bp.y - Y], off = [-p.side * 1.05 * s, -hip - .5 * s];
    if (p.side > 0) { hr = hand; hl = off; } else { hl = hand; hr = off; }
  } else if (ball.state === 'held' && ball.owner === p) { hl = [-.2 * s, -hip - .4 * s]; hr = [.9 * s, -hip - .3 * s]; }
  else if (p.reach > 0) { const o = other(p), d = Math.sign(o.x - p.x) || 1; const a = [d * 1.9 * s, -hip - .5 * s], b2 = [-d * .8 * s, -hip]; if (d > 0) { hr = a; hl = b2; } else { hl = a; hr = b2; } }

  else if (stance) { const w = Math.sin(G.t * 8) * .15 * s; hl = [-1.75 * s, -hip - 1.3 * s + w]; hr = [1.75 * s, -hip - 1.3 * s - w]; }

  ctx.fillStyle = c.hair; ctx.beginPath(); ctx.arc(0, hy - .05 * s, .47 * s, Math.PI * 1.05, Math.PI * 1.95); ctx.fill();
  ctx.strokeStyle = c.trim; ctx.lineWidth = .1 * s; ctx.beginPath(); ctx.moveTo(-.45 * s, hy - .12 * s); ctx.lineTo(.45 * s, hy - .12 * s); ctx.stroke();

    ctx.fillStyle = '#ffd23f'; ctx.font = `${.5 * s}px ${FONT}`;
    for (let i = 0; i < 3; i++) { const a = G.t * 6 + i * 2.1; ctx.fillText('✦', Math.cos(a) * .7 * s, hy - .7 * s + Math.sin(a) * .2 * s); }
  }
  ctx.restore();
  // 頭上標記

  ctx.fillStyle = p.isAI ? '#ff6b7d' : '#ffd23f';
  ctx.beginPath(); ctx.moveTo(X - 8, my - 12); ctx.lineTo(X + 8, my - 12); ctx.lineTo(X, my - 2); ctx.fill();
  ctx.font = `800 14px ${FONT}`; ctx.textAlign = 'center'; ctx.fillText(p.isAI ? 'CPU' : 'P1', X, my - 22);

    ctx.globalAlpha = clamp(a, 0, 1); ctx.font = `900 24px ${FONT}`; ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(0,0,0,.7)';
    ctx.strokeText(p.pop.text, X, my - 44 - rise); ctx.fillStyle = p.pop.color; ctx.fillText(p.pop.text, X, my - 44 - rise);
    ctx.globalAlpha = 1;

}

function drawMeter(p, x, y) {
  const live = p.shot && p.shot.type === 'jumper' && !p.shot.rel;
  if (!live && !p.meter) return;
  const v = live ? p.shot.meter : p.meter.v, h = 110, w = 14, top = y - h / 2, M = 1.25;
  const yv = m => top + h - clamp(m / M, 0, 1) * h;
  ctx.fillStyle = 'rgba(0,0,0,.6)'; rrect(x - 3, top - 3, w + 6, h + 6, 6); ctx.fill();
  ctx.fillStyle = 'rgba(200,255,106,.35)'; ctx.fillRect(x, yv(.9 + .12), w, yv(.9 - .12) - yv(.9 + .12));
  const gw = G.diff.green; ctx.fillStyle = '#3dff8a'; ctx.fillRect(x, yv(.9 + gw), w, yv(.9 - gw) - yv(.9 + gw));
  const col = live ? '#ffffff' : ({ green: '#3dff8a', good: '#c8ff6a', early: '#ffd23f', late: '#ffd23f' }[p.meter.tq] || '#ff6b6b');
  ctx.fillStyle = col; ctx.globalAlpha = .55; ctx.fillRect(x, yv(v), w, top + h - yv(v)); ctx.globalAlpha = 1;
  ctx.fillRect(x - 4, yv(v) - 2, w + 8, 4);
}

function drawBall() {
  if (ball.state === 'held' && !ball.owner) return;
  const b = P(ball.x, ball.y, ball.z), r = Math.max(3, .42 * b.s);
  const g = ctx.createRadialGradient(b.x - r * .35, b.y - r * .35, r * .1, b.x, b.y, r);

  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(b.x, b.y, r, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(30,10,0,.8)'; ctx.lineWidth = Math.max(1, r * .1);
  const rot = G.t * 6;
  ctx.beginPath(); ctx.arc(b.x, b.y, r, 0, 7); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(b.x + Math.cos(rot) * r, b.y + Math.sin(rot) * r); ctx.lineTo(b.x - Math.cos(rot) * r, b.y - Math.sin(rot) * r); ctx.stroke();

}

function drawMsgs() {

function render() {
  drawArena();
  if (!G.players.length) return;
  drawHoopBack();
  for (const p of G.players) drawShadow(p.x, p.y, p.z, 1.25);
  if (!(ball.state === 'held' && G.state === 'menu')) drawShadow(ball.x, ball.y, ball.z, .45);
  const items = G.players.map(p => ({ y: p.y, f: () => drawPlayer(p) }));
  items.push({ y: ball.state === 'held' && ball.owner ? ball.owner.y + .36 : ball.y, f: drawBall });
  items.push({ y: HOOP.y + .01, f: () => drawRimHalf(false) });
  items.sort((a, b) => a.y - b.y).forEach(i => i.f());
  if (G.state !== 'menu') { drawHUD(); drawMsgs(); }
}

// ================= 流程 / 選單 =================
const $ = id => document.getElementById(id);
function show(id, on) { $(id).classList.toggle('hidden', !on); }
function setPlayingUI(on) { show('touch', on && IS_TOUCH); show('topbtns', on); }

function startGame() {
  au();
  G.diff = DIFFS[G.diffKey];
  const ua = ARCHS[G.archIdx], ca = pick(ARCHS.filter(a => a !== ua));
  G.players = [mkPlayer(0, ua, false), mkPlayer(1, ca, true)];
  G.score = [0, 0]; G.msgs = []; G.t = 0;
  checkBall(Math.random() < .5 ? 0 : 1);
  msg(`搶 ${G.target} 分 · 開打！`, '#fff', true, 1.8);
  show('menu', false); show('over', false); show('pauseMenu', false); setPlayingUI(true);
}
function endGame(w) {
  G.state = 'over'; sfx.buzzer(); if (w === 0) sfx.cheer();
  setPlayingUI(false);
  $('overTitle').textContent = w === 0 ? '🏆 你贏了！' : 'CPU 獲勝，再接再厲';
  $('overTitle').style.color = w === 0 ? '#ffd23f' : '#ff6b7d';
  $('overScore').textContent = `${G.score[0]} : ${G.score[1]} · ${G.diff.nm}難度 · 你 (${user().arch.nm}) vs CPU (${cpu().arch.nm})`;
  const pct = s => s.fga ? Math.round(s.fgm / s.fga * 100) + '%' : '-';
  const a = user().st, b = cpu().st;
  const rows = [['得分', a.pts, b.pts], ['投籃', `${a.fgm}/${a.fga} (${pct(a)})`, `${b.fgm}/${b.fga} (${pct(b)})`], ['三分', `${a.tpm}/${a.tpa}`, `${b.tpm}/${b.tpa}`],
    ['灌籃', a.dnk, b.dnk], ['完美出手', a.grn, b.grn], ['抄截', a.stl, b.stl], ['火鍋', a.blk, b.blk], ['晃倒', a.ank, b.ank]];
  $('overStats').innerHTML = '<tr><th></th><th style="color:#6fb1ff">你</th><th style="color:#ff6b7d">CPU</th></tr>' + rows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('');
  setTimeout(() => show('over', true), 900);
}
let pausedFrom = null;
function togglePause() {
  if (G.state === 'play' || G.state === 'check') { pausedFrom = G.state; G.state = 'paused'; show('pauseMenu', true); }
  else if (G.state === 'paused') { G.state = pausedFrom; show('pauseMenu', false); last = performance.now(); }
}
function toMenu() { G.state = 'menu'; show('over', false); show('pauseMenu', false); show('menu', true); setPlayingUI(false); }

(function buildMenu() {
  const cards = $('cards');
  ARCHS.forEach((a, i) => {
    const el = document.createElement('button'); el.className = 'card' + (i === G.archIdx ? ' sel' : '');
    el.innerHTML = `<div class="nm">${a.nm}</div><div class="ds">${a.ds}</div>` +
      STAT_LABELS.map(([k, l]) => `<div class="stat"><b>${l}</b><div class="bar"><i style="width:${Math.round(a.r[k] * 100)}%"></i></div></div>`).join('');
    el.onclick = () => { G.archIdx = i; [...cards.children].forEach((c, j) => c.classList.toggle('sel', j === i)); };
    cards.appendChild(el);
  });
  const seg = (id, opts, get, set) => {
    const box = $(id);
    opts.forEach(([v, l]) => {
      const b = document.createElement('button'); b.textContent = l; if (get() === v) b.className = 'sel';
      b.onclick = () => { set(v); [...box.children].forEach(c => c.classList.toggle('sel', c === b)); };
      box.appendChild(b);
    });
  };
  seg('segDiff', Object.entries(DIFFS).map(([k, d]) => [k, d.nm]), () => G.diffKey, v => G.diffKey = v);
  seg('segTarget', [[11, '11 分'], [15, '15 分'], [21, '21 分']], () => G.target, v => G.target = v);
  if (IS_TOUCH) $('helpKeys').innerHTML = '左下搖桿移動 · 「投籃」按住起跳、<b>最高點放開</b>出手(綠區=完美)<br>「花式/抄截」進攻晃人、防守抄截 · 防守時按「投籃」跳起封阻 · 按住「衝刺」加速';
  $('btnStart').onclick = startGame;
  $('btnAgain').onclick = startGame;
  $('btnMenu').onclick = toMenu;
  $('btnQuit').onclick = toMenu;
  $('btnResume').onclick = togglePause;
  $('btnPause').onclick = togglePause;
  $('btnMute').onclick = () => { muted = !muted; $('btnMute').textContent = muted ? '🔇' : '🔊'; };
})();

// 主選單背景的展示畫面
G.players = [mkPlayer(0, ARCHS[0], false), mkPlayer(1, ARCHS[1], true)];
Object.assign(G.players[0], { x: -3, y: 24 }); Object.assign(G.players[1], { x: 4, y: 20 });
ball.owner = G.players[0];

let last = performance.now();
function frame(now) {
  const dt = Math.min(.033, (now - last) / 1000); last = now;
  if (G.state === 'menu') { G.t += dt; updBall(dt); }
  else update(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__G = G; window.__ball = ball;
</script>
</body>
