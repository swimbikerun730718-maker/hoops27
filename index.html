<style>

<script type="importmap">{"imports":{"three":"./lib/three.module.min.js"}}</script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from './lib/RoomEnvironment.js';
import { GLTFLoader } from './lib/jsm/loaders/GLTFLoader.js';
import { MeshoptDecoder } from './lib/jsm/libs/meshopt_decoder.module.js';

// ================= 基本設定 =================
const $ = id => document.getElementById(id);
const hud = $('hud'), ctx = hud.getContext('2d');
const W = 1280, H = 720; hud.width = W; hud.height = H;
const FONT = '"PingFang TC","Microsoft JhengHei","Noto Sans CJK TC","Noto Sans TC",sans-serif';
const HOOP = { x: 0, y: 5.25, z: 10 };           // 單位：英尺；y=0 底線、y=47 中線、z=高度
const SHOT_CLOCK = 14;
const IS_TOUCH = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = (a, b) => a + Math.random() * (b - a);
const hyp = Math.hypot;
const pick = a => a[Math.floor(Math.random() * a.length)];
function gauss() { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
const dHoop = o => hyp(o.x - HOOP.x, o.y - HOOP.y);
const beyondArc = (x, y) => y < 14.2 ? Math.abs(x) >= 22 : hyp(x, y - HOOP.y) >= 23.75;
const fwdOf = p => ({ x: Math.sin(p.face), y: Math.cos(p.face) });
const rightOf = p => ({ x: -Math.cos(p.face), y: Math.sin(p.face) });

const ARCHS = [
  { id: 'shooter', nm: '神射手', ds: '三分雨、出手穩，切入普通', r: { spd: .88, three: .93, mid: .86, inside: .62, dunk: .35, handle: .78, def: .6, stl: .62, blk: .38 } },
  { id: 'slasher', nm: '灌籃怪物', ds: '爆發力強、禁區霸主、封阻高手', r: { spd: .95, three: .46, mid: .64, inside: .9, dunk: .97, handle: .62, def: .76, stl: .55, blk: .9 } },
  { id: 'handler', nm: '控球魔術師', ds: '運球晃人、抄截、速度最快', r: { spd: 1, three: .77, mid: .8, inside: .76, dunk: .58, handle: .97, def: .7, stl: .9, blk: .4 } },
  { id: 'allround', nm: '全能前鋒', ds: '沒有明顯弱點的六邊形戰士', r: { spd: .92, three: .78, mid: .8, inside: .8, dunk: .8, handle: .78, def: .8, stl: .72, blk: .72 } },
];
const STAT_LABELS = [['three', '三分'], ['mid', '中距'], ['inside', '禁區'], ['dunk', '灌籃'], ['handle', '運球'], ['def', '防守']];
const DIFFS = {
  rookie: { nm: '新秀', ai: .82, react: .34, sd: .13, green: .075, spd: .9, stl: .25 },
  pro: { nm: '職業', ai: .95, react: .22, sd: .085, green: .05, spd: .97, stl: .45 },
  hof: { nm: '名人堂', ai: 1.05, react: .13, sd: .05, green: .035, spd: 1.02, stl: .7 },
};
const SPOTS = {
  shooter: [[-22, 3], [22, 3], [-16, 22], [16, 22], [0, 27], [-9, 25], [9, 25]],
  slasher: [[-10, 14], [10, 14], [0, 17], [-6, 9], [6, 9], [0, 26]],
  handler: [[0, 28], [-12, 24], [12, 24], [-6, 16], [6, 16]],
  allround: [[-14, 18], [14, 18], [0, 24], [-20, 8], [20, 8], [0, 15]],
};
const COLS = [
  { jer: '#1f6fff', shorts: '#1848b0', trim: '#ffd23f', skin: '#c98d5d', hair: '#1b1b1b', shoe: '#f4f4f4', num: '#ffffff', ring: '#ffd23f' },
  { jer: '#e8334a', shorts: '#a81d35', trim: '#ffffff', skin: '#7a4b30', hair: '#0e0e0e', shoe: '#1a1a1a', num: '#ffffff', ring: '#ff4d6d' },
];

// ================= 音效(WebAudio 合成) =================
let AC = null, muted = false, NB = null;
function au() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function env(g, t0, a, d, v) { g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(v, t0 + a); g.gain.exponentialRampToValueAtTime(0.0001, t0 + a + d); }
function tone(f, d, type, v, f2) {
  const a = au(); if (!a || muted) return;
  const o = a.createOscillator(), g = a.createGain(), t = a.currentTime;
  o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  env(g, t, .005, d, v); o.connect(g).connect(a.destination); o.start(t); o.stop(t + d + .05);
}
function noise(d, v, freq, q, type, att = .01) {
  const a = au(); if (!a || muted) return;
  if (!NB) { NB = a.createBuffer(1, a.sampleRate * 2, a.sampleRate); const ch = NB.getChannelData(0); for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1; }
  const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain(), t = a.currentTime;
  s.buffer = NB; f.type = type; f.frequency.value = freq; f.Q.value = q; env(g, t, att, d, v);
  s.connect(f).connect(g).connect(a.destination); s.start(t); s.stop(t + att + d + .05);
}
const sfx = {
  bounce: (v = 1) => tone(125, .09, 'sine', .3 * v, 55),
  swish: () => noise(.3, .25, 5200, .7, 'highpass', .02),
  clank: (v = 1) => { tone(540, .35, 'triangle', .13 * v, 500); tone(1230, .25, 'sine', .06 * v); },
  cheer: () => { noise(1.9, .17, 1100, .4, 'bandpass', .25); G.crowd = 2; },
  whistle: () => { tone(2900, .28, 'sine', .07); tone(3080, .28, 'sine', .05); },
  buzzer: () => tone(160, .8, 'sawtooth', .1),
  block: () => tone(90, .22, 'square', .13, 50),
  swipe: () => noise(.12, .12, 2500, 1, 'bandpass', .01),
};

// ================= 遊戲狀態 =================
const G = {
  state: 'menu', players: [], score: [0, 0], target: 21, diffKey: 'pro', diff: DIFFS.pro, archIdx: 0,
  offense: 0, shotClock: SHOT_CLOCK, needsClear: [false, false], checkT: 0, deadT: 0, pendingCheck: 0,
  msgs: [], net: 0, rimShake: 0, crowd: 0, board: 0, t: 0,
};
const ball = { state: 'held', owner: null, x: 0, y: 30, z: 3, vx: 0, vy: 0, vz: 0, f: null, lastTouch: 0, ph: 0, prevS: 1 };
const user = () => G.players[0], cpu = () => G.players[1], other = p => G.players[1 - p.team];

function mkPlayer(team, arch, isAI) {
  const r = { ...arch.r };
  if (isAI) for (const k in r) r[k] = Math.min(.99, r[k] * G.diff.ai);
  return {
    team, arch, isAI, r, col: COLS[team], num: team === 0 ? 7 : 11,
    x: 0, y: 30, z: 0, vx: 0, vy: 0, vz: 0, face: Math.PI, stam: 100, sprint: false,
    stun: 0, reach: 0, dashT: 0, dashDx: 0, dashDy: 0, dashCd: 0, stealCd: 0, lastDash: 1,
    shot: null, dunkHang: 0, anim: 0, side: 1, pop: null, meter: null,
    ai: { decT: 0, mode: 'spot', tx: 0, ty: 26, contestT: -1, stealT: rnd(1, 2), releaseAt: .9, jumpCd: 0 },
    aiIn: { mx: 0, my: 0, spr: false },
    st: { pts: 0, fga: 0, fgm: 0, tpa: 0, tpm: 0, dnk: 0, grn: 0, stl: 0, blk: 0, ank: 0 },
  };
}

function msg(text, color = '#fff', big = false, dur = 1.5) {
  G.msgs.push({ text, color, big, t: 0, dur });
  if (G.msgs.length > 3) G.msgs.shift();
}
function pop(p, text, color) { p.pop = { text, color, t: 0 }; }

// ================= 動作 =================
function jump(p) {
  if (p.z > .01 || p.shot || p.stun > 0 || p.dunkHang > 0) return;
  p.vz = p.vz0 = 12.5 + 2.5 * p.r.blk;
}

function startShot(p) {
  if (p.shot || p.z > .01 || p.stun > 0 || ball.owner !== p) return;
  if (G.needsClear[p.team]) { if (!p.isAI) pop(p, '先清球！帶出三分線', '#ffd23f'); return; }
  const d = dHoop(p);
  let type = 'jumper';
  if (d < 8.5) type = (p.r.dunk >= .55 && d < 7.5 && (p.sprint || p.r.dunk > .8 || d < 4)) ? 'dunk' : 'layup';
  p.shot = { type, t: 0, meter: 0, rel: false, d, three: beyondArc(p.x, p.y) };
  if (type === 'jumper') { p.vz = 12; p.vx *= .2; p.vy *= .2; }
  else {
    const k = 1.3 / Math.max(d, .1);
    const tx = HOOP.x + (p.x - HOOP.x) * k, ty = Math.max(HOOP.y + .7, HOOP.y + (p.y - HOOP.y) * k);
    p.vx = (tx - p.x) / .42; p.vy = (ty - p.y) / .42; p.vz = type === 'dunk' ? 17 : 13;
  }
  p.vz0 = p.vz;
  if (p.isAI) p.ai.releaseAt = clamp(.9 + gauss() * G.diff.sd, .55, 1.2);
  const o = other(p);
  if (o.isAI) o.ai.contestT = G.diff.react * rnd(.8, 1.25);
}

function release(p) {
  const s = p.shot; if (!s || s.rel) return;
  s.rel = true;
  if (ball.owner !== p) return;
  const o = other(p), dd = hyp(o.x - p.x, o.y - p.y);
  let tq = 'auto', timing = 1;
  if (s.type === 'jumper') {
    const e = s.meter - .9, gw = p.isAI ? .04 : G.diff.green, ae = Math.abs(e);
    if (ae <= gw) tq = 'green';
    else if (ae <= .12) tq = 'good';
    else if (ae <= .2) { tq = e < 0 ? 'early' : 'late'; timing = .62; }
    else { tq = e < 0 ? 'vearly' : 'vlate'; timing = .3; }
    if (!p.isAI) {
      const T = { green: ['完美！', '#3dff8a'], good: ['不錯', '#c8ff6a'], early: ['稍早', '#ffd23f'], late: ['稍晚', '#ffd23f'], vearly: ['太早', '#ff6b6b'], vlate: ['太晚', '#ff6b6b'] }[tq];
      pop(p, T[0], T[1]); p.meter = { v: s.meter, tq, t: 0 };
    }
  }
  const oAir = o.z > .7;
  const front = ((HOOP.x - p.x) * (o.x - p.x) + (HOOP.y - p.y) * (o.y - p.y)) > -1;
  if (oAir && front && o.stun <= 0 && dd < (s.type === 'jumper' ? 4 : 4.8)) {
    let bc = o.r.blk * .62 * (1 - dd / 5.5) + .08;
    if (tq === 'green') bc *= .4;
    if (s.type === 'dunk') bc *= .7;
    if (Math.random() < bc) { blockShot(p, o); return; }
  }
  const pm = makeProb(p, s, tq, timing, dd, oAir && dd < 4.5);
  p.st.fga++; if (s.three) p.st.tpa++;
  launch(p, s, Math.random() < pm, s.three ? 3 : 2, tq);
}

function makeProb(p, s, tq, timing, dd, oAirClose) {
  let pr;
  if (s.type === 'dunk') pr = .72 + .26 * p.r.dunk;
  else if (s.type === 'layup') pr = .5 + .38 * p.r.inside;
  else {
    const rt = s.three ? p.r.three : (s.d < 14 ? (p.r.mid + p.r.inside) / 2 : p.r.mid);
    pr = .2 + .5 * rt;
    if (s.d > 26) pr -= (s.d - 26) * .05;
    pr = tq === 'green' ? .97 : pr * timing;
  }
  let cf = 1;
  if (dd < 6) { cf = .35 + .65 * clamp((dd - 1.5) / 4.5, 0, 1); if (oAirClose) cf *= .8; }
  if (tq === 'green') cf = Math.sqrt(cf);
  if (s.type === 'dunk') cf = .55 + .45 * cf;
  pr *= cf * (.82 + .18 * p.stam / 100);
  return clamp(pr, .02, .98);
}

function launch(p, s, make, pts, tq) {
  const f = fwdOf(p);
  const sx = p.x + f.x * .5, sy = p.y + f.y * .5, sz = p.z + (s.type === 'jumper' ? 8.4 : 8.3);
  let ex = HOOP.x, ey = HOOP.y, ez = HOOP.z + .3;
  if (!make) { const a = rnd(0, Math.PI * 2); ex += Math.cos(a) * .85; ey += Math.sin(a) * .85; ez = HOOP.z + .2; }
  let T, Hh;
  if (s.type === 'dunk') { T = .14; Hh = 0; }
  else if (s.type === 'layup') { T = .5; Hh = 2; }
  else { T = .8 + s.d * .013; Hh = 3.5 + s.d * .2; }
  ball.state = 'flight'; ball.owner = null; ball.lastTouch = p.team;
  ball.f = { sx, sy, sz, ex, ey, ez, t: 0, T, Hh, make, pts, shooter: p, type: s.type, tq };
  ball.x = sx; ball.y = sy; ball.z = sz;
  G.offense = p.team;
  if (s.type === 'dunk' && make) {
    p.dunkHang = .5; p.x = HOOP.x + (p.x - HOOP.x) * .25; p.y = HOOP.y + 1.3; p.vx = p.vy = 0; p.z = 2.4;
    p.face = Math.atan2(HOOP.x - p.x, HOOP.y - p.y);
  }
}

function blockShot(p, o) {
  o.st.blk++; p.st.fga++; if (p.shot.three) p.st.tpa++;
  ball.state = 'loose'; ball.owner = null; ball.lastTouch = o.team; G.offense = p.team;
  ball.x = p.x; ball.y = p.y; ball.z = p.z + 8.5;
  const a = Math.atan2(p.y - HOOP.y, p.x - HOOP.x) + rnd(-.7, .7), sp = rnd(10, 16);
  ball.vx = Math.cos(a) * sp; ball.vy = Math.sin(a) * sp; ball.vz = rnd(2, 7);
  msg('火鍋！封阻！', '#ff9a3c', true); sfx.block(); sfx.cheer();
}

function dribbleMove(p) {
  if (p.dashCd > 0 || p.shot || p.z > .01 || p.stun > 0) return;
  const hx = HOOP.x - p.x, hy = HOOP.y - p.y, hl = hyp(hx, hy) || 1;
  const px = -hy / hl, py = hx / hl;
  let dir = -p.lastDash;
  if (!p.isAI && inp.mx) dir = Math.sign(inp.mx * px) || dir;
  p.lastDash = dir;
  const dx = px * dir * .9 + hx / hl * .35, dy = py * dir * .9 + hy / hl * .35, dl = hyp(dx, dy);
  p.dashDx = dx / dl; p.dashDy = dy / dl;
  p.dashT = .28; p.dashCd = .9; p.stam = Math.max(0, p.stam - 10); p.side = -p.side;
  sfx.bounce(1);
  if (!p.isAI) pop(p, pick(['胯下運球', '背後運球', '交叉步', '轉身']), '#9fd0ff');
  const o = other(p), d = hyp(o.x - p.x, o.y - p.y);
  if (d < 5.5 && o.stun <= 0 && o.z < .01) {
    const ahead = ((HOOP.x - p.x) * (o.x - p.x) + (HOOP.y - p.y) * (o.y - p.y)) > 0;
    const ch = ahead ? p.r.handle * .33 - o.r.def * .28 + p.stam / 1000 + (o.reach > 0 ? .25 : 0) : 0;
    if (Math.random() < ch) { o.stun = .95; p.st.ank++; msg('晃倒了！！', '#ffd23f', true); sfx.cheer(); }
  }
}

function trySteal(p) {
  if (p.stealCd > 0 || p.stun > 0) return;
  const h = ball.owner;
  if (ball.state !== 'held' || !h || h.team === p.team) return;
  p.stealCd = .8; p.reach = .5; sfx.swipe();
  if (hyp(h.x - p.x, h.y - p.y) > 4.2) return;
  let ch = p.r.stl * .4 - h.r.handle * .18 + .05;
  if (h.dashT > 0) ch *= .3;
  if (h.shot && !h.shot.rel) ch *= .5;
  if (Math.random() >= ch) return;
  p.st.stl++; h.shot = null;
  if (Math.random() < .55) giveBall(p, 'steal');
  else {
    ball.state = 'loose'; ball.owner = null; ball.x = h.x; ball.y = h.y; ball.z = 2.5;
    const a = Math.atan2(p.y - h.y, p.x - h.x) + rnd(-.8, .8);
    ball.vx = Math.cos(a) * 9; ball.vy = Math.sin(a) * 9; ball.vz = 4; ball.lastTouch = p.team;
  }
  msg('抄截！', '#7dffb0', true); sfx.cheer();
}

function giveBall(p, kind) {
  ball.state = 'held'; ball.owner = p; ball.lastTouch = p.team; p.dashT = 0;
  if (p.team !== G.offense) {
    G.offense = p.team;
    G.needsClear = [false, false];
    G.needsClear[p.team] = !beyondArc(p.x, p.y);
    if (kind === 'rebound') msg(p.isAI ? 'CPU 防守籃板' : '防守籃板', '#cfd6e6');
    if (!p.isAI && G.needsClear[p.team]) pop(p, '帶出三分線清球', '#ffd23f');
  } else if (kind === 'rebound') msg(p.isAI ? 'CPU 進攻籃板' : '進攻籃板！', '#cfd6e6');
  G.shotClock = SHOT_CLOCK;
}

function checkBall(team) {
  G.state = 'check'; G.checkT = 1.3; G.offense = team; G.needsClear = [false, false]; G.shotClock = SHOT_CLOCK;
  const o = G.players[team], d = G.players[1 - team];
  const reset = { z: 0, vx: 0, vy: 0, vz: 0, shot: null, stun: 0, reach: 0, dunkHang: 0, dashT: 0 };
  Object.assign(o, reset, { x: 0, y: 32, face: Math.PI }); Object.assign(d, reset, { x: 0, y: 26.5, face: 0 });
  ball.state = 'held'; ball.owner = o; ball.lastTouch = team; ball.f = null;
  sfx.whistle();
}

// ================= 輸入 =================
const keys = {}, inp = { mx: 0, my: 0, sprint: false }, touch = { active: false, x: 0, y: 0, sprint: false };
const GAME_KEYS = [' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'];
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (GAME_KEYS.includes(k) && G.state !== 'menu') e.preventDefault();
  if (e.repeat) return;
  keys[k] = true;
  if (k === ' ' || k === 'j') actPrimary(true);
  else if (k === 'e' || k === 'k') actSecondary();
  else if (k === 'p' || k === 'escape') togglePause();
});
addEventListener('keyup', e => { const k = e.key.toLowerCase(); keys[k] = false; if (k === ' ' || k === 'j') actPrimary(false); });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; if (G.state === 'play' || G.state === 'check') togglePause(); });

let readMove = function () {
  let x = 0, y = 0;
  if (keys['a'] || keys['arrowleft']) x--; if (keys['d'] || keys['arrowright']) x++;
  if (keys['w'] || keys['arrowup']) y--; if (keys['s'] || keys['arrowdown']) y++;
  if (touch.active) { x = touch.x; y = touch.y; }
  const m = hyp(x, y); if (m > 1) { x /= m; y /= m; }
  inp.mx = x; inp.my = y; inp.sprint = !!(keys['shift'] || touch.sprint);
};
function actPrimary(down) {
  au();
  if (G.state !== 'play') return;
  const p = user();
  if (down) { if (ball.state === 'held' && ball.owner === p) startShot(p); else jump(p); }
  else if (p.shot && p.shot.type === 'jumper' && !p.shot.rel) release(p);
}
function actSecondary() {
  au();
  if (G.state !== 'play') return;
  const p = user();
  if (ball.state === 'held' && ball.owner === p) dribbleMove(p); else trySteal(p);
}

(function setupTouch() {
  const stick = $('stick'), knob = $('knob');
  let sid = null;
  const setKnob = (x, y) => { knob.style.transform = `translate(${x}px,${y}px)`; };
  const move = e => {
    const r = stick.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    let dx = e.clientX - cx, dy = e.clientY - cy; const m = hyp(dx, dy), R = r.width * .38;
    if (m > R) { dx *= R / m; dy *= R / m; }
    setKnob(dx, dy); touch.x = dx / R; touch.y = dy / R;
    if (hyp(touch.x, touch.y) < .18) touch.x = touch.y = 0;
  };
  stick.addEventListener('pointerdown', e => { au(); sid = e.pointerId; stick.setPointerCapture(sid); touch.active = true; move(e); });
  stick.addEventListener('pointermove', e => { if (e.pointerId === sid) move(e); });
  const end = e => { if (e.pointerId !== sid) return; sid = null; touch.active = false; touch.x = touch.y = 0; setKnob(0, 0); };
  stick.addEventListener('pointerup', end); stick.addEventListener('pointercancel', end);
  const btn = (id, down, up) => {
    const el = $(id);
    el.addEventListener('pointerdown', e => { e.preventDefault(); el.setPointerCapture(e.pointerId); el.classList.add('on'); down(); });
    const u = () => { el.classList.remove('on'); up && up(); };
    el.addEventListener('pointerup', u); el.addEventListener('pointercancel', u);
  };
  btn('bShoot', () => actPrimary(true), () => actPrimary(false));
  btn('bMove', () => actSecondary());
  btn('bSprint', () => { touch.sprint = true; }, () => { touch.sprint = false; });
})();

// ================= AI =================
function aiUpdate(p, dt) {
  const o = other(p), a = p.ai;
  let mx = 0, my = 0, spr = false;
  const goTo = (tx, ty, stop = .8) => {
    const dx = tx - p.x, dy = ty - p.y, d = hyp(dx, dy);
    if (d > stop) { mx = dx / d; my = dy / d; } else if (d > .15) { mx = dx / stop; my = dy / stop; }
  };
  a.jumpCd = Math.max(0, a.jumpCd - dt);
  if (ball.state === 'held' && ball.owner === p) {
    a.decT -= dt;
    const dh = dHoop(p);
    if (!p.shot && a.decT <= 0) {
      a.decT = rnd(.22, .5);
      const open = hyp(o.x - p.x, o.y - p.y);
      const tx = (HOOP.x - p.x) / dh, ty = (HOOP.y - p.y) / dh, ox = o.x - p.x, oy = o.y - p.y;
      const along = ox * tx + oy * ty, lat = Math.abs(ox * ty - oy * tx);
      const laneBlocked = along > 0 && along < dh && lat < 3.2 && o.stun <= 0;
      if (G.needsClear[p.team]) a.mode = 'clear';
      else if (dh < 7.5 && (!laneBlocked || Math.random() < .5)) startShot(p);
      else if (G.shotClock < 2.2) startShot(p);
      else {
        const range = p.r.three > .7 ? 26 : (p.r.mid > .75 ? 21 : 15);
        if ((open > (dh > 22 ? 3.8 : 5.5) || o.stun > 0) && dh < range && Math.random() < .75) startShot(p);
        else if (!laneBlocked && Math.random() < .25 + p.r.inside * .35) a.mode = 'drive';
        else if (open < 4.5 && p.dashCd <= 0 && Math.random() < .45) { dribbleMove(p); a.mode = 'drive'; }
        else if (a.mode !== 'spot' || hyp(a.tx - p.x, a.ty - p.y) < 1.5) { const s = pick(SPOTS[p.arch.id]); a.tx = s[0]; a.ty = s[1]; a.mode = 'spot'; }
      }
    }
    if (!p.shot) {
      if (a.mode === 'clear') {
        const ux = (p.x - HOOP.x) / (dh || 1), uy = Math.max(.35, (p.y - HOOP.y) / (dh || 1)), ul = hyp(ux, uy);
        goTo(clamp(HOOP.x + ux / ul * 26.5, -23.5, 23.5), clamp(HOOP.y + uy / ul * 26.5, 1, 42), .3);
      } else if (a.mode === 'drive') { goTo(HOOP.x, HOOP.y + 2, .1); spr = p.stam > 20; }
      else goTo(a.tx, a.ty);
    }
  } else if (ball.state === 'held' && ball.owner === o) {
    const dh = dHoop(o) || 1, gd = dh > 28 ? 6 : dh > 24 ? 4.2 : 3.2;
    const tx = o.x + (HOOP.x - o.x) / dh * gd, ty = o.y + (HOOP.y - o.y) / dh * gd;
    goTo(tx, ty, .5); spr = hyp(tx - p.x, ty - p.y) > 4;
    if (o.shot && !o.shot.rel) {
      goTo(o.x, o.y, 1.6); spr = true;
      if (a.contestT >= 0) { a.contestT -= dt; if (a.contestT < 0 && hyp(o.x - p.x, o.y - p.y) < 7) jump(p); }
    }
    a.stealT -= dt;
    if (a.stealT <= 0) { a.stealT = rnd(1.2, 3); if (hyp(o.x - p.x, o.y - p.y) < 4 && Math.random() < G.diff.stl) trySteal(p); }
  } else if (ball.state === 'flight') {
    const dh = dHoop(p) || 1;
    goTo(HOOP.x + (p.x - HOOP.x) / dh * 7, HOOP.y + Math.max(2, (p.y - HOOP.y) / dh * 7), .5); spr = true;
  } else if (ball.state === 'loose') {
    goTo(ball.x + ball.vx * .25, ball.y + ball.vy * .25, .2); spr = true;
    if (ball.z > 6 && ball.z < 11 && hyp(ball.x - p.x, ball.y - p.y) < 3 && a.jumpCd <= 0) { jump(p); a.jumpCd = 1; }
  }
  p.aiIn.mx = mx; p.aiIn.my = my; p.aiIn.spr = spr;
}

// ================= 更新 =================
function updFacing(p, dt) {
  const o = other(p), sp = hyp(p.vx, p.vy);
  let tx, ty;
  if (p.dunkHang > 0 || p.shot) { tx = HOOP.x - p.x; ty = HOOP.y - p.y; }
  else if (G.state === 'check') { tx = o.x - p.x; ty = o.y - p.y; }
  else if (ball.state === 'held' && ball.owner === o) { tx = o.x - p.x; ty = o.y - p.y; }
  else if (ball.owner === p) {
    const hx = HOOP.x - p.x, hy = HOOP.y - p.y;
    if (sp > 4 && p.vx * hx + p.vy * hy < -sp * hyp(hx, hy) * .3) { tx = p.vx; ty = p.vy; } else { tx = hx; ty = hy; }
  } else if (sp > 2) { tx = p.vx; ty = p.vy; }
  else if (ball.state !== 'held') { tx = ball.x - p.x; ty = ball.y - p.y; }
  else { tx = HOOP.x - p.x; ty = HOOP.y - p.y; }
  if (!tx && !ty) return;
  const ta = Math.atan2(tx, ty); let d = ta - p.face; d = Math.atan2(Math.sin(d), Math.cos(d));
  p.face += d * Math.min(1, dt * 12);
}

function updPlayer(p, dt, mx, my, sprint) {
  p.stun = Math.max(0, p.stun - dt); p.reach = Math.max(0, p.reach - dt);
  p.dashCd = Math.max(0, p.dashCd - dt); p.stealCd = Math.max(0, p.stealCd - dt);
  if (p.pop) { p.pop.t += dt; if (p.pop.t > 1.1) p.pop = null; }
  if (p.meter) { p.meter.t += dt; if (p.meter.t > .8) p.meter = null; }
  const air = p.z > .01 || p.vz > 0;
  if (p.dunkHang > 0) {
    p.dunkHang -= dt; p.vx = p.vy = p.vz = 0;
    if (p.dunkHang <= 0) p.vz = -1;
  } else if (p.shot) {
    const s = p.shot; s.t += dt;
    if (s.type === 'jumper') {
      if (!s.rel) s.meter += dt * 2.35;
      p.vx *= .85; p.vy *= .85;
      if (!s.rel && (s.meter >= 1.25 || (p.isAI && s.meter >= p.ai.releaseAt))) release(p);
    } else if (!s.rel && s.t >= .42) release(p);
  } else if (!air) {
    let spd = 15 * p.r.spd * (p.isAI ? G.diff.spd : 1);
    p.sprint = sprint && p.stam > 5 && (mx !== 0 || my !== 0);
    if (p.sprint) { spd *= 1.4; p.stam -= 22 * dt; } else p.stam = Math.min(100, p.stam + 14 * dt);
    if (p.stun > 0) spd *= .12;
    if (p.reach > 0) spd *= .45;
    if (ball.owner === p) spd *= .93;
    let tvx = mx * spd, tvy = my * spd;
    if (p.dashT > 0) { p.dashT -= dt; tvx = p.dashDx * 27; tvy = p.dashDy * 27; }
    const k = Math.min(1, dt * (p.dashT > 0 ? 30 : 11));
    p.vx += (tvx - p.vx) * k; p.vy += (tvy - p.vy) * k;
  }
  p.stam = Math.max(0, p.stam);
  p.x += p.vx * dt; p.y += p.vy * dt;
  if (p.dunkHang <= 0) { p.z += p.vz * dt; p.vz -= 34 * dt; }
  if (p.z <= 0) {
    p.z = 0;
    if (p.vz < 0) { p.vz = 0; if (p.shot) { if (!p.shot.rel) release(p); p.shot = null; } }
  }
  p.x = clamp(p.x, -24.3, 24.3); p.y = clamp(p.y, .6, 43);
  p.anim += hyp(p.vx, p.vy) * dt * .62;
  updFacing(p, dt);
}

function separate() {
  const [a, b] = G.players;
  if (a.dunkHang > 0 || b.dunkHang > 0) return;
  const dx = b.x - a.x, dy = b.y - a.y, d = hyp(dx, dy), md = 2.1;
  if (d < md && d > .001) { const push = (md - d) / 2; a.x -= dx / d * push; a.y -= dy / d * push; b.x += dx / d * push; b.y += dy / d * push; }
}

function updBall(dt) {
  if (ball.state === 'held') {
    const p = ball.owner, f = fwdOf(p), r = rightOf(p);
    if (p.shot && !p.shot.rel) {
      ball.x = p.x + f.x * .55; ball.y = p.y + f.y * .55;
      ball.z = p.z + (p.shot.type === 'jumper' ? 6.9 + Math.min(1, p.shot.t / .25) * 1.3 : 6.2 + Math.min(1, p.shot.t / .42) * 2.8);
    } else if (G.state === 'check') { ball.x = p.x + f.x * 1.05; ball.y = p.y + f.y * 1.05; ball.z = 4.1; }
    else {
      ball.ph += dt * (7 + hyp(p.vx, p.vy) * .35);
      const s = Math.abs(Math.sin(ball.ph));
      if (s < .15 && ball.prevS >= .15 && G.state === 'play') sfx.bounce(.3);
      ball.prevS = s;
      ball.x = p.x + r.x * p.side * 1.05 + f.x * .6; ball.y = p.y + r.y * p.side * 1.05 + f.y * .6;
      ball.z = .39 + s * 2.75 + p.z;
    }
  } else if (ball.state === 'flight') {
    const f = ball.f; f.t += dt; const u = Math.min(1, f.t / f.T);
    ball.x = f.sx + (f.ex - f.sx) * u; ball.y = f.sy + (f.ey - f.sy) * u;
    ball.z = f.sz + (f.ez - f.sz) * u + f.Hh * 4 * u * (1 - u);
    if (u >= 1) arrive(f);
  } else if (ball.state === 'loose' || ball.state === 'dead') {
    ball.vz -= 32 * dt;
    if (ball.state === 'dead' && ball.z > 8.2) { ball.x = HOOP.x; ball.y = HOOP.y; }
    else { ball.x += ball.vx * dt; ball.y += ball.vy * dt; }
    ball.z += ball.vz * dt;
    if (ball.z < .39) {
      ball.z = .39;
      if (ball.vz < -3) { ball.vz = -ball.vz * .62; sfx.bounce(.6); } else ball.vz = 0;
      const fr = Math.pow(.35, dt); ball.vx *= fr; ball.vy *= fr;
    }
    if (ball.state === 'loose') {
      if (Math.abs(ball.x) > 25.5 || ball.y > 45 || ball.y < -.5) {
        msg('出界', '#cfd6e6'); checkBall(1 - ball.lastTouch); return;
      }
      let best = null, bd = 1e9;
      for (const p of G.players) {
        if (p.stun > 0 || p.shot || p.dunkHang > 0) continue;
        const d = hyp(p.x - ball.x, p.y - ball.y);
        if (d < 2.4 && ball.z < 7.5 + p.z && d < bd) { bd = d; best = p; }
      }
      if (best) giveBall(best, 'rebound');
    }
  }
}

function arrive(f) {
  const p = f.shooter;
  if (f.make) {
    ball.state = 'dead'; ball.x = HOOP.x; ball.y = HOOP.y; ball.z = HOOP.z - .2; ball.vx = 0; ball.vy = rnd(1, 2.5); ball.vz = -6;
    G.score[p.team] += f.pts; p.st.fgm++; p.st.pts += f.pts;
    if (f.pts === 3) p.st.tpm++;
    if (f.type === 'dunk') p.st.dnk++;
    if (f.tq === 'green') p.st.grn++;
    G.net = .6; G.board = .8; sfx.swish();
    let t = f.type === 'dunk' ? '暴力灌籃！！' : f.pts === 3 ? '三分命中！' : '進球！';
    if (f.tq === 'green') t = '完美出手 · ' + t;
    msg((p.isAI ? 'CPU ' : '') + t, p.team === 0 ? '#6fb1ff' : '#ff6b7d', true);
    if (f.type === 'dunk' || f.pts === 3 || f.tq === 'green') sfx.cheer();
    if (f.type === 'dunk') { G.rimShake = .5; sfx.clank(.5); }
    G.deadT = 1.1; G.pendingCheck = 1 - p.team;
  } else {
    sfx.clank(); G.rimShake = .25;
    const a = Math.atan2(ball.y - HOOP.y, ball.x - HOOP.x) + rnd(-.6, .6), sp = rnd(5, 12);
    ball.state = 'loose'; ball.vx = Math.cos(a) * sp; ball.vy = Math.abs(Math.sin(a)) * sp * .9 + 2; ball.vz = rnd(6, 12);
    G.shotClock = SHOT_CLOCK;
  }
}

function rules(dt) {
  if (ball.state === 'held') {
    const o = ball.owner;
    if (G.needsClear[o.team] && beyondArc(o.x, o.y)) { G.needsClear[o.team] = false; if (!o.isAI) pop(o, '清球完成', '#7dffb0'); }
    if (!(o.shot && o.shot.rel)) {
      G.shotClock -= dt;
      if (G.shotClock <= 0) { msg('進攻時間違例', '#ff6b6b', true); sfx.buzzer(); checkBall(1 - o.team); }
    }
  } else if (ball.state === 'dead') {
    G.deadT -= dt;
    if (G.deadT <= 0) {
      const w = G.score.findIndex(s => s >= G.target);
      if (w >= 0) endGame(w); else checkBall(G.pendingCheck);

  if (G.state === 'check') {
    ctx.font = `italic 900 56px ${FONT}`; ctx.lineWidth = 8; ctx.strokeStyle = 'rgba(0,0,0,.75)';
    const t = G.offense === 0 ? '你的球權' : 'CPU 球權';
    ctx.strokeText('CHECK BALL', W / 2, H / 2 - 20); ctx.fillStyle = '#fff'; ctx.fillText('CHECK BALL', W / 2, H / 2 - 20);
    ctx.font = `800 24px ${FONT}`; ctx.fillStyle = G.offense === 0 ? '#6fb1ff' : '#ff6b7d'; ctx.fillText(t, W / 2, H / 2 + 26);
  }
}

function render(dt) {
  sync3D(dt);
  renderer.render(scene, camera);
  ctx.clearRect(0, 0, W, H);
  if (G.state !== 'menu') { drawPlayerMarks(); drawHUD(); drawMsgs(); }
}

function fit() { const s = $('stage'); renderer.setSize(s.clientWidth, s.clientHeight, false); }
addEventListener('resize', fit); fit();

// ================= 流程 / 選單 =================
function show(id, on) { $(id).classList.toggle('hidden', !on); }
function setPlayingUI(on) { show('touch', on && IS_TOUCH); show('topbtns', on); }

function startGame() {
  au();
  G.diff = DIFFS[G.diffKey];
  const ua = ARCHS[G.archIdx], ca = pick(ARCHS.filter(a => a !== ua));
  G.players = [mkPlayer(0, ua, false), mkPlayer(1, ca, true)];
  G.score = [0, 0]; G.msgs = []; G.t = 0;
  checkBall(Math.random() < .5 ? 0 : 1);
  msg(`搶 ${G.target} 分 · 開打！`, '#fff', true, 1.8);
  show('menu', false); show('over', false); show('pauseMenu', false); setPlayingUI(true);
}
function endGame(w) {
  G.state = 'over'; sfx.buzzer(); if (w === 0) sfx.cheer();
  setPlayingUI(false);
  $('overTitle').textContent = w === 0 ? '🏆 你贏了！' : 'CPU 獲勝，再接再厲';
  $('overTitle').style.color = w === 0 ? '#ffd23f' : '#ff6b7d';
  $('overScore').textContent = `${G.score[0]} : ${G.score[1]} · ${G.diff.nm}難度 · 你 (${user().arch.nm}) vs CPU (${cpu().arch.nm})`;
  const pct = s => s.fga ? Math.round(s.fgm / s.fga * 100) + '%' : '-';
  const a = user().st, b = cpu().st;
  const rows = [['得分', a.pts, b.pts], ['投籃', `${a.fgm}/${a.fga} (${pct(a)})`, `${b.fgm}/${b.fga} (${pct(b)})`], ['三分', `${a.tpm}/${a.tpa}`, `${b.tpm}/${b.tpa}`],
    ['灌籃', a.dnk, b.dnk], ['完美出手', a.grn, b.grn], ['抄截', a.stl, b.stl], ['火鍋', a.blk, b.blk], ['晃倒', a.ank, b.ank]];
  $('overStats').innerHTML = '<tr><th></th><th style="color:#6fb1ff">你</th><th style="color:#ff6b7d">CPU</th></tr>' + rows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('');
  setTimeout(() => show('over', true), 900);
}
let pausedFrom = null;
function togglePause() {
  if (G.state === 'play' || G.state === 'check') { pausedFrom = G.state; G.state = 'paused'; show('pauseMenu', true); }
  else if (G.state === 'paused') { G.state = pausedFrom; show('pauseMenu', false); last = performance.now(); }
}
function setupDemo() {
  G.players = [mkPlayer(0, ARCHS[0], false), mkPlayer(1, ARCHS[1], true)];
  Object.assign(G.players[0], { x: -3, y: 22, face: Math.atan2(3, -17) });
  Object.assign(G.players[1], { x: 3, y: 14, face: Math.atan2(-6, 8) });
  ball.state = 'held'; ball.owner = G.players[0];
}
function toMenu() { G.state = 'menu'; setupDemo(); show('over', false); show('pauseMenu', false); show('menu', true); setPlayingUI(false); }

(function buildMenu() {
  const cards = $('cards');
  ARCHS.forEach((a, i) => {
    const el = document.createElement('button'); el.className = 'card' + (i === G.archIdx ? ' sel' : '');
    el.innerHTML = `<div class="nm">${a.nm}</div><div class="ds">${a.ds}</div>` +
      STAT_LABELS.map(([k, l]) => `<div class="stat"><b>${l}</b><div class="bar"><i style="width:${Math.round(a.r[k] * 100)}%"></i></div></div>`).join('');
    el.onclick = () => { G.archIdx = i; [...cards.children].forEach((c, j) => c.classList.toggle('sel', j === i)); };
    cards.appendChild(el);
  });
  const seg = (id, opts, get, set) => {
    const box = $(id);
    opts.forEach(([v, l]) => {
      const b = document.createElement('button'); b.textContent = l; if (get() === v) b.className = 'sel';
      b.onclick = () => { set(v); [...box.children].forEach(c => c.classList.toggle('sel', c === b)); };
      box.appendChild(b);
    });
  };
  seg('segDiff', Object.entries(DIFFS).map(([k, d]) => [k, d.nm]), () => G.diffKey, v => G.diffKey = v);
  seg('segTarget', [[11, '11 分'], [15, '15 分'], [21, '21 分']], () => G.target, v => G.target = v);
  if (IS_TOUCH) $('helpKeys').innerHTML = '左下搖桿移動 · 「投籃」按住起跳、<b>最高點放開</b>出手(綠區=完美)<br>「花式/抄截」進攻晃人、防守抄截 · 防守時按「投籃」跳起封阻 · 按住「衝刺」加速';
  $('btnStart').onclick = startGame; $('btnStart').textContent = '載入球員模型…';
  $('btnAgain').onclick = startGame;
  $('btnMenu').onclick = toMenu;
  $('btnQuit').onclick = toMenu;
  $('btnResume').onclick = togglePause;
  $('btnPause').onclick = togglePause;
  $('btnMute').onclick = () => { muted = !muted; $('btnMute').textContent = muted ? '🔇' : '🔊'; };
})();

setupDemo();
loadPlayers().catch(e => console.warn('寫實模型載入失敗，改用簡易模型', e))
  .finally(() => { $('btnStart').disabled = false; $('btnStart').textContent = '開始比賽'; });
let last = performance.now();
function frame(now) {
  const dt = Math.min(.033, (now - last) / 1000); last = now;
  update(dt);
  render(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// 測試用掛勾
window.__T = { THREE, G, ball, sync3D, rigs, update, aiUpdate, user, cpu, startGame, inp, setReadMove: f => { readMove = f; } };
</script>
</body>
</html>
